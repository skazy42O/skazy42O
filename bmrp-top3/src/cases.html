<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.case{position:relative;width:820px;height:560px}

.panel{position:absolute;left:104px;top:164px;width:598px;height:308px;overflow:hidden;z-index:1;font-family:Anton}
.panel svg{position:absolute;inset:0}
.gloss{position:absolute;left:104px;top:164px;width:598px;height:308px;z-index:2;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 30%,transparent 31%,transparent 70%,rgba(255,255,255,.07) 71%,transparent 85%)}
.inner-shadow{position:absolute;left:104px;top:164px;width:598px;height:308px;z-index:2;box-shadow:inset 0 0 40px rgba(0,0,0,.75),inset 0 8px 20px rgba(0,0,0,.6)}
.ttl{position:absolute;text-align:center;line-height:.9;letter-spacing:2px}
.sub{font-family:Oswald;font-weight:700;letter-spacing:10px}
</style></head><body>
<div id="out"></div>

const P={W:598,H:308};
const waves=(c,o=1,y=0)=>`<g fill="none" stroke-linecap="round" opacity="${o}" transform="translate(0 ${y})">
 <path d="M-20 200 C120 90 260 260 620 60" stroke="${c}" stroke-width="20"/>
 <path d="M-20 232 C150 130 280 290 620 110" stroke="${c}" stroke-width="7" opacity=".85"/>
 <path d="M-20 168 C100 70 300 210 620 20" stroke="${c}" stroke-width="3.5" opacity=".6"/></g>`;

document.getElementById('out').innerHTML=Object.keys(ART).map(k=>`<div class="case" id="case-${k}"><div class="panel">${ART[k]}</div><div class="inner-shadow"></div><div class="gloss"></div><img src="chest-${k}.png"></div>`).join('');
</script></body></html>
